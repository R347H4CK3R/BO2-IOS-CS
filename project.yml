name: BO2IOSCS
options:
  bundleIdPrefix: com.r347h4ck3r
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  BO2IOSCS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: GameData
        buildPhase: resources
      - path: GeneratedGameData
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r347h4ck3r.bo2ioscs
        PRODUCT_NAME: BO2IOSCS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BO2 iOS CS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - BO2IOSCSTests
  BO2IOSCSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: BO2IOSCS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r347h4ck3r.bo2ioscs.tests
        GENERATE_INFOPLIST_FILE: YES
