name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode inventory and selection
        run: |
          ls -1 /Applications | grep '^Xcode' || true
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' ! -iname '*beta*' -print | sort | tail -1)"
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available
          xcrun simctl list runtimes
      - name: Validate proprietary exclusions
        run: |
          ! git ls-files | grep -E '(^|/)(PS3_GAME|GeneratedGameData|LocalGameData|ProprietaryAssets)(/|$)'
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -resolvePackageDependencies -project BO2IOSCS.xcodeproj -scheme BO2IOSCS

  converter-unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s Tools/PS3AssetConverter -p 'test_*.py'

  open-source-engine-simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' ! -iname '*beta*' -print | sort | tail -1)"
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install engine build dependencies
        run: brew install cmake ninja python
      - name: Build pinned Xash3D FWGS for iOS Simulator
        run: |
          chmod +x Scripts/build_xash_ios.sh
          ./Scripts/build_xash_ios.sh simulator
      - name: Package Xash Simulator runtime app
        run: |
          chmod +x Scripts/package_xash_runtime.sh
          ./Scripts/package_xash_runtime.sh simulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XashSimulatorEngineBuild
          path: Build/XashSimulator/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XashSimulatorRuntimeApp
          path: |
            Build/XashSimulatorRuntime/BO2IOSCS.app
            Build/XashSimulatorRuntime/XASH_SIMULATOR_RUNTIME_REPORT.md
          if-no-files-found: error

  open-source-engine-device-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' ! -iname '*beta*' -print | sort | tail -1)"
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install engine build dependencies
        run: brew install cmake ninja python
      - name: Build pinned Xash3D FWGS for ARM64 iOS device
        run: |
          chmod +x Scripts/build_xash_ios.sh
          ./Scripts/build_xash_ios.sh device
      - name: Package integrated Xash runtime IPA
        run: |
          chmod +x Scripts/package_xash_runtime.sh
          ./Scripts/package_xash_runtime.sh
      - name: Validate integrated Xash runtime IPA
        run: |
          chmod +x Tools/validate_xash_ipa.sh
          ./Tools/validate_xash_ipa.sh Build/XashRuntime/BO2IOSCS-Xash-integrated.ipa Build/XashRuntime/XASH_IPA_VALIDATION_REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XashDeviceEngineBuild
          path: Build/XashDevice/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BO2IOSCS-Xash-integrated-IPA
          path: |
            Build/XashRuntime/BO2IOSCS-Xash-integrated.ipa
            Build/XashRuntime/XASH_RUNTIME_REPORT.md
            Build/XashRuntime/XASH_IPA_VALIDATION_REPORT.md
          if-no-files-found: warn

  xash-simulator-runtime-test:
    needs: open-source-engine-simulator-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: XashSimulatorRuntimeApp
          path: Build/XashSimulatorRuntime
      - name: Run native Xash Simulator startup test
        run: |
          chmod +x Scripts/run_xash_simulator_test.sh
          ./Scripts/run_xash_simulator_test.sh Build/XashSimulatorRuntime/BO2IOSCS.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XashSimulatorRuntimeResults
          path: |
            XASH_SIMULATOR_TEST_REPORT.md
            Build/XashRuntimeLogs/
          if-no-files-found: warn

  simulator-build:
    needs: [source-validation, converter-unit-tests]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: chmod +x Scripts/*.sh Tools/*.sh
      - run: ./Scripts/build_ios.sh simulator
      - uses: actions/upload-artifact@v4
        with:
          name: SimulatorBuild
          path: Build/SimulatorBuild.zip

  simulator-runtime-test:
    needs: simulator-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SimulatorBuild
          path: downloaded
      - run: |
          mkdir -p Build/DerivedData/Build/Products/Debug-iphonesimulator Build/UnpackedSimulator
          ZIP="$(find downloaded -name SimulatorBuild.zip -print -quit)"
          ditto -x -k "$ZIP" Build/UnpackedSimulator
          APP="$(find Build/UnpackedSimulator -type d -name BO2IOSCS.app -print -quit)"
          test -n "$APP"
          # The uploaded archive may already contain BO2IOSCS.app at the expected
          # destination. Avoid cp's self-copy failure on macOS runners.
          DEST="Build/DerivedData/Build/Products/Debug-iphonesimulator/BO2IOSCS.app"
          if [ "$(cd "$(dirname "$APP")" && pwd)/$(basename "$APP")" != "$(cd "$(dirname "$DEST")" && pwd)/$(basename "$DEST")" ]; then
            rm -rf "$DEST"
            cp -R "$APP" "$DEST"
          fi
          chmod +x Scripts/*.sh
          ./Scripts/run_simulator_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SimulatorRuntimeResults
          path: |
            SIMULATOR_TEST_REPORT.md
            AUTOTEST_RESULT.json
            Build/RuntimeLogs/

  device-build:
    needs: [source-validation, converter-unit-tests]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: chmod +x Scripts/*.sh Tools/*.sh
      - run: ./Scripts/build_ios.sh device
      - name: Package device app handoff
        run: ditto -c -k --sequesterRsrc --keepParent Build/DerivedDataDevice/Build/Products/Release-iphoneos/BO2IOSCS.app Build/DeviceApp.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeviceApp
          path: Build/DeviceApp.zip

  ipa-packaging-validation:
    needs: [device-build, simulator-runtime-test]
    if: always() && needs.device-build.result == 'success'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeviceApp
          path: downloaded
      - run: |
          mkdir -p Build/Payload Build/UnpackedDevice
          ZIP="$(find downloaded -name DeviceApp.zip -print -quit)"
          ditto -x -k "$ZIP" Build/UnpackedDevice
          APP="$(find Build/UnpackedDevice -type d -name BO2IOSCS.app -print -quit)"
          cp -R "$APP" Build/Payload/
          (cd Build && zip -qry BO2IOSCS-unsigned.ipa Payload)
          chmod +x Tools/validate_ipa.sh
          ./Tools/validate_ipa.sh Build/BO2IOSCS-unsigned.ipa IPA_VALIDATION_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: BO2IOSCS-unsigned-IPA
          path: |
            Build/BO2IOSCS-unsigned.ipa
            IPA_VALIDATION_REPORT.md
            PROJECT_PROGRESS.json
            BUILD_NOTES.md
